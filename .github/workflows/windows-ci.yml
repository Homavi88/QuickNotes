# Build Windows installers on PRs and main; upload as workflow artifacts.
# Unsigned MVP builds — Windows SmartScreen may warn end users.
name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows installers (MSI + NSIS)
        # Prefer .msi and NSIS .exe; unsigned is OK for this MVP.
        run: npm run tauri build -- --bundles msi,nsis

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: QuickNotes-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
